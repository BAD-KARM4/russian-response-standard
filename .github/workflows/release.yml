name: Publish Skill Release

on:
  push:
    branches:
      - main
    paths:
      - SKILL.md
      - agents/openai.yaml
      - assets/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from SKILL.md
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^Версия: v' SKILL.md | sed 's/^Версия: //')"
          if [ -z "$VERSION" ]; then
            echo "Version not found in SKILL.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version is unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Bump the version in SKILL.md before publishing new content."
            exit 1
          fi

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="russian-response-standard-$VERSION.zip"

          rm -rf release
          mkdir -p release/russian-response-standard

          cp SKILL.md release/russian-response-standard/
          cp -R agents release/russian-response-standard/
          cp -R assets release/russian-response-standard/

          (
            cd release
            zip -r "../$ARCHIVE" russian-response-standard
          )

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
